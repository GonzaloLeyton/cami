# XcodeGen spec: CI generates Cami.xcodeproj from this, so no Mac is needed to create it.
name: Cami
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Cami:
    type: application
    platform: iOS
    sources: [Cami]
    info:
      path: Cami/Info.plist
      properties:
        CFBundleDisplayName: Cami
        NSCameraUsageDescription: Para usar el iPhone como webcam
        NSLocalNetworkUsageDescription: Para enviar video por Wi-Fi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.gonzaloleyton.cami
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
